<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepAI - Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="planner-page">

    <div class="planner-container">
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

        <h1> My Study Planner</h1>
        <p>Organize your study tasks and track your progress.</p>

        <div class="planner-form">
            <input type="text" id="taskInput"
                   placeholder="Enter your study task">

            <input type="text" id="subjectInput"
                   placeholder="Enter subject">

            <input type="date" id="dateInput">

            <button onclick="addTask()">Add Task +</button>
        </div>

        <div class="planner-stats">
            <h3>Total Tasks: <span id="totalTasks">0</span></h3>
            <h3>Completed: <span id="completedTasks">0</span></h3>
        </div>

        <h2>My Tasks</h2>
        <div id="taskList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
